            color: white;

            padding: 14px;

            margin-top: 20px;

        }

            }
        }

        document.getElementById("remaining-count").innerText = `Kalan Kelime: ${activeWords.length}`;
        document.getElementById("next-btn").classList.add("hidden");
        document.getElementById("feedback").innerText = "";
        answered = false;

        currentWordObj = activeWords[Math.floor(Math.random() * activeWords.length)];
        
        const wordDisplay = document.getElementById("current-word");
        if (gamePhase === 3) {
            wordDisplay.innerText = currentWordObj.sentence;
            wordDisplay.style.fontSize = "18px";
            wordDisplay.style.lineHeight = "1.5";
            wordDisplay.style.fontWeight = "500";
        } else {
            wordDisplay.innerText = currentWordObj.word;
            wordDisplay.style.fontSize = "28px";
            wordDisplay.style.fontWeight = "bold";
        }

        document.getElementById("level-tag").innerText = currentWordObj.level;
        
        let badgeColor = "#95a5a6";
        if(currentWordObj.level === "A1") badgeColor = "#f1c40f";
        else if(currentWordObj.level === "A2") badgeColor = "#e67e22";
        else if(currentWordObj.level === "B1") badgeColor = "#3498db";
        else if(currentWordObj.level === "B2") badgeColor = "#9b59b6";
        else if(currentWordObj.level === "C1") badgeColor = "#e74c3c";
        document.getElementById("level-tag").style.backgroundColor = badgeColor;
        
        let currentScore = gamePhase === 1 ? currentWordObj.scoreMeaning : (gamePhase === 2 ? currentWordObj.scoreSynonym : currentWordObj.scoreSentence);
        document.getElementById("word-streak").innerText = `Seri: ${currentScore}/2`;

        generateOptions();
    }

    function generateOptions() {
        let targetAnswer = "";
        if (gamePhase === 1) targetAnswer = currentWordObj.meaning;
        else if (gamePhase === 2) targetAnswer = currentWordObj.synonym;
        else if (gamePhase === 3) targetAnswer = currentWordObj.word;

        let options = [targetAnswer];
        
        let allAnswers = rawWords.map(w => {
            if (gamePhase === 1) return w.meaning;
            if (gamePhase === 2) return w.synonym;
            if (gamePhase === 3) return w.word;
        }).filter(val => val !== targetAnswer);
        
        let uniqueWrongAnswers = [...new Set(allAnswers)];
        
        while (options.length < 5 && uniqueWrongAnswers.length > 0) {
            let randIdx = Math.floor(Math.random() * uniqueWrongAnswers.length);
            options.push(uniqueWrongAnswers.splice(randIdx, 1)[0]);
        }

        options.sort(() => Math.random() - 0.5);

        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";
        const labels = ['A', 'B', 'C', 'D', 'E'];

        options.forEach((opt, idx) => {
            let btn = document.createElement("button");
            btn.className = "btn-option";
            btn.innerText = `${labels[idx]}) ${opt}`;
            btn.onclick = () => checkAnswer(btn, opt, targetAnswer);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedValue, targetAnswer) {
        if (answered) return;
        answered = true;

        const optionsDiv = document.getElementById("options");
        const buttons = optionsDiv.getElementsByClassName("btn-option");
        const feedbackDiv = document.getElementById("feedback");

        if (selectedValue === targetAnswer) {
            selectedBtn.classList.add("correct");
            
            if (gamePhase === 1) currentWordObj.scoreMeaning++;
            else if (gamePhase === 2) currentWordObj.scoreSynonym++;
            else if (gamePhase === 3) currentWordObj.scoreSentence++;
            
            let currentScore = gamePhase === 1 ? currentWordObj.scoreMeaning : (gamePhase === 2 ? currentWordObj.scoreSynonym : currentWordObj.scoreSentence);

            feedbackDiv.style.color = "#2ecc71";
            if (currentScore === 2) {
                feedbackDiv.innerText = "Mükemmel! Üst üste 2 kez bildin ve bu kelimeyi bu bölüm için eledin! 🎉";
            } else {
                feedbackDiv.innerText = "Harika, doğru cevap! Kelimeyi kalıcı temizlemek için 1 kez daha bilmelisin.";
            }
        } else {
            selectedBtn.classList.add("wrong");
            
            if (gamePhase === 1) currentWordObj.scoreMeaning = 0;
            else if (gamePhase === 2) currentWordObj.scoreSynonym = 0;
            else if (gamePhase === 3) currentWordObj.scoreSentence = 0;
            
            feedbackDiv.style.color = "#e74c3c";
            feedbackDiv.innerText = `Yanlış! Doğru cevap: "${targetAnswer}" olmalıydı.`;

            for (let btn of buttons) {
                if (btn.innerText.substring(3) === targetAnswer) {
                    btn.classList.add("correct");
                }
            }
        }

        document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
        initGame();
    }

    function showTransitionScreen(nextPhase, textText) {
        document.getElementById("trans-desc").innerHTML = textText;
        document.getElementById("trans-btn").setAttribute("data-next", nextPhase);
        document.getElementById("transition-zone").classList.remove("hidden");
    }

    function proceedToNextPhase() {
        let next = parseInt(document.getElementById("trans-btn").getAttribute("data-next"));
        gamePhase = next;
        document.getElementById("transition-zone").classList.add("hidden");
        
        let titleObj = document.getElementById("phase-title");
        if (gamePhase === 2) {
            titleObj.innerText = "Bölüm 2: İngilizce Eş Anlamlı (Synonym) Eşleştirme";
            titleObj.style.color = "#2980b9";
            titleObj.style.backgroundColor = "#eaf2f8";
        } else if (gamePhase === 3) {
            titleObj.innerText = "Bölüm 3: Akademik Cümle Boşluk Doldurma";
            titleObj.style.color = "#8e44ad";
            titleObj.style.backgroundColor = "#f5eef8";
        }
        initGame();
    }

    initGame();
</script>
